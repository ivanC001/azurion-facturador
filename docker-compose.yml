services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azurion_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: azurion_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: azurion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: azurion_facturador
      POSTGRES_USER: azurion
      POSTGRES_PASSWORD: azurion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: azurion_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azurion_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=sunat,default --sleep=1 --tries=5 --timeout=120
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azurion_horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis

volumes:
  postgres_data:
