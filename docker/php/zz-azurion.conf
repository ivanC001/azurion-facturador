[www]
; The base image defaults to only five children, which becomes the first
; bottleneck under concurrent PDF/status requests. Keep this bounded so an
; overloaded container applies backpressure instead of exhausting memory.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
request_terminate_timeout = 125s
catch_workers_output = yes
clear_env = no
